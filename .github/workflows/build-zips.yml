name: Gerar zips das skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validar skills e gerar páginas e zips
        run: python scripts/build.py "${{ github.repository_owner }}"
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A skills dist .claude-plugin README.md
            git commit -m "Atualiza páginas e zips das skills"
            git push
          fi
